name: playwright-tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build -t meat-tests -f Dockerfile.tests .

      - name: Run tests
        run: docker run --rm meat-tests
